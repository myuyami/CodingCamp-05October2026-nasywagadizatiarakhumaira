<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Name Modal (first visit) -->
  <div id="name-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>👋 Welcome!</h2>
      <p>What's your name? I'll use it to greet you.</p>
      <input type="text" id="modal-name-input" placeholder="Enter your name..." maxlength="40" />
      <button id="modal-save-btn">Let's Go →</button>
    </div>
  </div>

  <!-- Dashboard Wrapper -->
  <div class="dashboard">

    <!-- TOP CARD: Clock, Date, Greeting -->
    <div class="card card-top">
      <button id="theme-toggle" class="theme-btn" title="Toggle dark mode">🌙</button>
      <div id="clock" class="clock">00:00:00</div>
      <div id="date-display" class="date-display"></div>
      <div id="greeting" class="greeting">Hello!</div>
      <button id="change-name-btn" class="change-name-btn">✏️ Change Name</button>
    </div>

    <!-- MIDDLE ROW -->
    <div class="middle-row">

      <!-- MIDDLE LEFT: Focus Timer -->
      <div class="card card-timer">
        <h2 class="card-title">⏱ Focus Timer</h2>
        <div id="timer-display" class="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="timer-start" class="btn btn-green">Start</button>
          <button id="timer-stop" class="btn btn-yellow">Stop</button>
          <button id="timer-reset" class="btn btn-red">Reset</button>
        </div>
      </div>

      <!-- MIDDLE RIGHT: Tasks -->
      <div class="card card-tasks">
        <h2 class="card-title">✅ Tasks</h2>
        <div class="task-input-row">
          <input type="text" id="task-input" placeholder="Add a new task..." maxlength="100" />
          <button id="task-add-btn" class="btn btn-primary">Add</button>
        </div>
        <p id="task-error" class="task-error hidden">Task already exists!</p>
        <ul id="task-list" class="task-list"></ul>
      </div>

    </div><!-- end middle-row -->

    <!-- BOTTOM LEFT: Quick Links -->
    <div class="card card-links">
      <h2 class="card-title">🔗 Quick Links</h2>
      <div class="link-input-group">
        <input type="text" id="link-name-input" placeholder="Link name" maxlength="30" />
        <input type="url" id="link-url-input" placeholder="https://..." maxlength="200" />
        <button id="link-add-btn" class="btn btn-primary">Add Link</button>
      </div>
      <p id="link-error" class="task-error hidden">Please fill in both fields.</p>
      <div id="links-container" class="links-container"></div>
    </div>

  </div><!-- end dashboard -->

  <script src="app.js"></script>
</body>
</html>
